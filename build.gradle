plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.5'
    id 'io.spring.dependency-management' version '1.1.6'
}




group = 'org.example'
version = '1.0-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    runtimeOnly 'org.postgresql:postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'





    implementation group: 'com.fasterxml.jackson.core', name: 'jackson-databind', version: '2.17.2'
    implementation group: 'com.fasterxml.jackson.dataformat', name: 'jackson-dataformat-csv', version: '2.17.2'
//
//    implementation group: 'org.springframework', name: 'spring-core', version: '6.1.12'
//    implementation group: 'org.springframework', name: 'spring-context', version: '6.1.12'
//    implementation group: 'org.springframework', name: 'spring-beans', version: '6.1.12'
//
//
//    implementation group: 'org.springframework', name: 'spring-orm', version: '6.1.12'
//    implementation group: 'org.hibernate.orm', name: 'hibernate-core', version: '6.6.1.Final'
//
    implementation group: 'org.hibernate.orm', name: 'hibernate-jcache', version: '6.6.1.Final'
    implementation group: 'org.ehcache', name: 'ehcache', version: '3.10.8'
    implementation group: 'commons-io', name: 'commons-io', version: '2.17.0'

//
//
//    implementation group: 'org.postgresql', name: 'postgresql', version: '42.7.3'
//    implementation group: 'org.springframework', name: 'spring-jdbc', version: '6.1.12'
//
//    implementation group: 'jakarta.annotation', name: 'jakarta.annotation-api', version: '3.0.0'
//
//    implementation group: 'org.springframework', name: 'spring-aop', version: '6.1.12'
//    implementation group: 'org.aspectj', name: 'aspectjweaver', version: '1.9.22'









    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}






test {
    useJUnitPlatform()
}